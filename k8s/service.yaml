apiVersion: v1
kind: Service
metadata:
  name: upi-simulator-service
  labels:
    app: upi-simulator
    tier: api
spec:
  type: ClusterIP
  selector:
    app: upi-simulator
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
