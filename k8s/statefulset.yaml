# ============================================================================
# NOT APPLIED by kustomization.yaml
#
# Educational example of per-pod volumes. Do not deploy this StatefulSet as
# extra payment writers: each replica would get its own SQLite file and a
# divergent ledger. The live simulator is the single Deployment in this folder.
# ============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: upi-consensus-nodes
  labels:
    app: upi-consensus
    component: distributed-worker
    tier: synchronization
spec:
  serviceName: upi-nodes-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: upi-consensus
  template:
    metadata:
      labels:
        app: upi-consensus
        component: distributed-worker
        tier: synchronization
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consensus-worker
          image: upi-simulator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: peer-comm
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: upi-simulator-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: node-data
              mountPath: /app/data
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: node-data
        labels:
          app: upi-consensus
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 500Mi
